name: 01 · Quality | Security & Regression

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security · regression, dependencies and image scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest httpx bandit pip-audit boto3
      - name: Compile
        run: python -m compileall -q teledrive web tests
      - name: Packaged import and entrypoint
        run: |
          python -m pip install --no-deps -e .
          python -c "import teledrive.db, teledrive.uploader; print('package-import-ok')"

      - name: Unit tests
        run: python -m pytest -q tests/web/test_security.py tests/web/test_openapi.py tests/storage/test_storage_engine.py tests/storage/test_storage_user_mode.py tests/storage/test_storage_recovery.py tests/storage/test_storage_rebuild.py tests/storage/test_telegram_history_inventory.py tests/storage/test_telegram_inventory_reconcile.py tests/storage/test_storage_pending_admin.py tests/storage/test_storage_jobs.py tests/storage/test_legacy_bridge.py tests/storage/test_legacy_import_admin.py tests/storage/test_storage_versions.py tests/storage/test_storage_ops_health.py tests/meta/test_host_soak.py tests/meta/test_acceptance_cli.py tests/storage/test_storage_gc_retention.py tests/storage/test_gc_reference_planner.py tests/s3/test_s3_version_reads.py tests/s3/test_s3_bucket_versioning.py tests/s3/test_s3_public_access_block.py tests/s3/test_s3_lifecycle.py tests/s3/test_s3_tagging.py tests/s3/test_s3_bucket_listing.py tests/storage/test_storage_user_mode.py tests/storage/test_mtproto_rate_guard.py tests/storage/test_mtproto_multi_credentials.py tests/storage/test_telegram_dr_rehearsal.py tests/meta/test_production_bundle.py tests/meta/test_capacity_probe.py tests/storage/test_legacy_cutover_acceptance.py tests/storage/test_telegram_target_resolution.py tests/meta/test_ci_workflows.py tests/meta/test_release_matrix.py tests/storage/test_storage_catalog.py tests/web/test_api_keys.py tests/web/test_rest_api.py tests/web/test_unified_service.py tests/web/test_rest_transfer.py tests/s3/test_s3_sigv4_defense.py tests/s3/test_s3_fail_closed.py tests/s3/test_s3_route_guard.py tests/s3/test_s3_policy_status.py tests/s3/test_s3_contract.py tests/storage/test_metadata_backup.py tests/storage/test_storage_sigkill.py tests/storage/test_metadata_snapshot_rehearsal.py tests/s3/test_s3_multipart_preconditions.py
      - name: Dependency consistency
        run: python -m pip check
      - name: Bandit
        run: bandit -q -r teledrive web -ll
      - name: Dependency audit
        run: pip-audit -r requirements.txt
      - name: Docker Compose config
        env:
          TELEDRIVE_WEB_PASSWORD: ci-only-not-a-real-secret
        run: |
          docker compose config --quiet
          
      - name: Docker build
        run: docker build --pull -t teledrive-security-ci .

      - name: Single-container Web UI and S3 gateway smoke
        shell: bash
        run: |
          set -euo pipefail
          set -euo pipefail
          mkdir -p /tmp/ci-config /tmp/ci-data
          chmod 700 /tmp/ci-config /tmp/ci-data
          cat > /tmp/ci-config/config.yaml <<'EOF'
          web:
            user: ci
            password: ci-only-not-a-real-secret
            allowed_hosts: "localhost,127.0.0.1,[::1]"
          storage:
            channel: ""
            apis: []
          state:
            database_url: "sqlite:////data/state.db"
          EOF
          chmod 600 /tmp/ci-config/config.yaml
          cid="$(docker run -d --rm \
            --user "$(id -u):$(id -g)" \
            -v /tmp/ci-config:/config \
            -v /tmp/ci-data:/data \
            -p 127.0.0.1:18080:8080 \
            -p 127.0.0.1:19000:9000 \
            teledrive-security-ci)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          ready=0
          for i in $(seq 1 45); do
            if curl -fsS -u ci:ci-only-not-a-real-secret \
              http://127.0.0.1:18080/api/dashboard >/tmp/dashboard.json \
              && curl -fsS http://127.0.0.1:19000/__health >/tmp/s3-health.json; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then docker logs "$cid" | tail -60; exit 1; fi
          python - <<'PY'
          import json
          data = json.load(open("/tmp/dashboard.json", encoding="utf-8"))
          assert "queue" in data and "accounts" in data and "database_url" in data
          assert json.load(open("/tmp/s3-health.json", encoding="utf-8")) == {"ok": True}
          PY
          curl -fsS -u ci:ci-only-not-a-real-secret \
            http://127.0.0.1:18080/openapi.json >/tmp/openapi.json
          python - <<'PY'
          import json
          schema=json.load(open("/tmp/openapi.json",encoding="utf-8"))
          assert "/api/auth" in schema["paths"]
          PY
          if curl -fsS http://127.0.0.1:18080/openapi.json >/dev/null; then
            echo "Anonymous Web API unexpectedly available" >&2
            exit 1
          fi
          if curl -fsS http://127.0.0.1:18080/__health >/dev/null; then
            echo "S3 listener accidentally accessible through Web port" >&2
            exit 1
          fi
          if curl -fsS http://127.0.0.1:19000/api/health >/dev/null; then
            echo "Web listener accidentally accessible through S3 port" >&2
            exit 1
          fi
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: teledrive-security-ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Publish CI run summary
        if: always()
        shell: bash
        run: |
          echo '### 01 · Quality | Security & Regression' >> "$GITHUB_STEP_SUMMARY"
          echo '| Detail | Value |' >> "$GITHUB_STEP_SUMMARY"
          echo '| --- | --- |' >> "$GITHUB_STEP_SUMMARY"
          echo '| Scope | Offline regression; dependency and container security tests |' >> "$GITHUB_STEP_SUMMARY"
          echo '| Result | ${{ job.status }} |' >> "$GITHUB_STEP_SUMMARY"
          printf '| Ref | %s |\n' "$GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
          printf '| Commit | %s |\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
