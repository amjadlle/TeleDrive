name: Database Integration CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  database:
    name: PostgreSQL + MySQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: teledrive
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: teledrive
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teledrive -d teledrive"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-test-password
          MYSQL_DATABASE: teledrive
          MYSQL_USER: teledrive
          MYSQL_PASSWORD: test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u root -proot-test-password"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      DB_TEST_POSTGRES_URL: postgresql+psycopg://teledrive:test-password@127.0.0.1:5432/teledrive
      DB_TEST_MYSQL_URL: mysql+pymysql://teledrive:test-password@127.0.0.1:3306/teledrive
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and DB drivers
        run: |
          python -m pip install -e .
          python -m pip install pytest "psycopg[binary]>=3.2,<4" "PyMySQL>=1.1,<2" "defusedxml==0.7.1" "cryptography>=50,<51"
          python -m pip check
      - name: Run live PostgreSQL/MySQL integration tests
        run: python -m pytest -vv tests/test_database_live.py tests/test_storage_engine.py tests/test_storage_recovery.py
      - name: Seed realistic metadata before native database backup
        run: |
          python scripts/rehearse_native_database_restore.py seed --url-env DB_TEST_POSTGRES_URL --receipt "$RUNNER_TEMP/pg-dr.json" --source "$RUNNER_TEMP/pg-source.bin"
          python scripts/rehearse_native_database_restore.py seed --url-env DB_TEST_MYSQL_URL --receipt "$RUNNER_TEMP/mysql-dr.json" --source "$RUNNER_TEMP/mysql-source.bin"
      - name: Native PostgreSQL 17 pg_dump and isolated pg_restore
        run: |
          set -euo pipefail
          docker run --rm --network host -e PGPASSWORD=test-password -v "$RUNNER_TEMP:/snap" postgres:17-alpine \
            pg_dump --host=127.0.0.1 --username=teledrive --dbname=teledrive --format=custom --file=/snap/pg-ci.backup --no-owner
          docker run --rm --network host -e PGPASSWORD=test-password postgres:17-alpine \
            psql --host=127.0.0.1 --username=teledrive --dbname=teledrive --set=ON_ERROR_STOP=1 \
            --command="CREATE DATABASE teledrive_dr_ci"
          docker run --rm --network host -e PGPASSWORD=test-password -v "$RUNNER_TEMP:/snap" postgres:17-alpine \
            pg_restore --host=127.0.0.1 --username=teledrive --dbname=teledrive_dr_ci --no-owner --no-privileges --exit-on-error /snap/pg-ci.backup
          python scripts/rehearse_native_database_restore.py verify --url-env DB_TEST_POSTGRES_URL --restore-database teledrive_dr_ci --receipt "$RUNNER_TEMP/pg-dr.json"
      - name: Native MySQL 8.4 mysqldump and isolated restore
        run: |
          set -euo pipefail
          docker run --rm --network host -e MYSQL_PWD=test-password mysql:8.4 \
            mysqldump --host=127.0.0.1 --user=teledrive --single-transaction --quick --no-tablespaces --set-gtid-purged=OFF teledrive > "$RUNNER_TEMP/mysql-ci.sql"
          docker run --rm --network host -e MYSQL_PWD=root-test-password mysql:8.4 \
            mysql --host=127.0.0.1 --user=root --execute="CREATE DATABASE teledrive_dr_ci CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; GRANT ALL PRIVILEGES ON teledrive_dr_ci.* TO 'teledrive'@'%';"
          docker run --rm --interactive --network host -e MYSQL_PWD=test-password mysql:8.4 \
            mysql --host=127.0.0.1 --user=teledrive --database=teledrive_dr_ci < "$RUNNER_TEMP/mysql-ci.sql"
          python scripts/rehearse_native_database_restore.py verify --url-env DB_TEST_MYSQL_URL --restore-database teledrive_dr_ci --receipt "$RUNNER_TEMP/mysql-dr.json"
