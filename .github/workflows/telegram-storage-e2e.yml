name: Telegram Storage E2E (manual)

on:
  workflow_dispatch:
    inputs:
      run_stress:
        description: "Run 5/16 MiB real Telethon chunk upload and recovery"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
      - feature/docker-webui-multiaccount

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # In-progress Telegram writes must finish their cleanup.
  cancel-in-progress: false

jobs:
  telegram-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEDRIVE_E2E_API_ID: ${{ secrets.TELEDRIVE_E2E_API_ID }}
      TELEDRIVE_E2E_API_HASH: ${{ secrets.TELEDRIVE_E2E_API_HASH }}
      TELEDRIVE_E2E_SESSION: ${{ secrets.TELEDRIVE_E2E_SESSION }}
      TELEDRIVE_E2E_TARGET: ${{ secrets.TELEDRIVE_E2E_TARGET }}
      TELEDRIVE_E2E_CHANNEL_NAME: ${{ secrets.TELEDRIVE_E2E_CHANNEL_NAME }}
      TELEDRIVE_E2E_STRESS: ${{ ((github.event_name == 'workflow_dispatch' && inputs.run_stress) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[p1-live-size]'))) && '1' || '0' }}
    steps:
      # Numeric Telegram peers must be masked before Python or any
      # diagnostic command runs, never sourced from visible repo vars.
      - name: Mask optional Telegram user target
        shell: bash
        run: |
          if [[ -n "$TELEDRIVE_E2E_TARGET" ]]; then
            echo "::add-mask::$TELEDRIVE_E2E_TARGET"
          fi
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Check user E2E session configuration
        shell: bash
        id: configured
        run: |
          if [[ -z "$TELEDRIVE_E2E_API_ID" || -z "$TELEDRIVE_E2E_API_HASH" || -z "$TELEDRIVE_E2E_SESSION" ]]; then
            echo "::error::User Telegram E2E not configured; run the local setup script once."
            exit 1
          elif [[ -z "$TELEDRIVE_E2E_CHANNEL_NAME" && -z "$TELEDRIVE_E2E_TARGET" ]]; then
            echo "::error::User Telegram E2E target not configured."
            exit 1
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install storage dependencies
        if: steps.configured.outputs.enabled == 'true'
        run: |
          python -m pip install -e .
          python -m pip install pytest
      - name: Real Telegram upload, retrieval, checksum and Range
        if: steps.configured.outputs.enabled == 'true'
        run: python -m pytest -q tests/test_telegram_storage_e2e.py
