name: Telegram Bot Storage E2E

on:
  workflow_dispatch:
    inputs:
      run_multipart:
        description: "Run 5 MiB+ real Telegram multipart assembly and cleanup test"
        required: false
        default: false
        type: boolean
      run_soak:
        description: "Run 12 real mixed-size Bot uploads with SQL restarts and cleanup"
        required: false
        default: false
        type: boolean
      run_ack_proof:
        description: "Verify lost Bot ACK against independent Telethon channel history"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: teledrive-live-bot-${{ github.repository }}
  # In-progress Telegram writes must finish their cleanup.
  cancel-in-progress: false

jobs:
  telegram-bot-roundtrip:
    # A one-shot multiworker push must exercise just the multiworker writer,
    # not also enqueue the normal Bot writer against the same channel.
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[p1-live-multiworker]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TELEDRIVE_E2E_BOT_TOKEN: ${{ secrets.TELEDRIVE_E2E_BOT_TOKEN }}
      TELEDRIVE_E2E_BOT_CHAT_ID: ${{ secrets.TELEDRIVE_E2E_BOT_CHAT_ID }}
      TELEDRIVE_E2E_API_ID: ${{ secrets.TELEDRIVE_E2E_API_ID }}
      TELEDRIVE_E2E_API_HASH: ${{ secrets.TELEDRIVE_E2E_API_HASH }}
      TELEDRIVE_E2E_SESSION: ${{ secrets.TELEDRIVE_E2E_SESSION }}
      TELEDRIVE_E2E_CROSS_CLIENT: ${{ ((github.event_name == 'workflow_dispatch' && inputs.run_ack_proof) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[p1-live-ack-proof]'))) && '1' || '0' }}
      # A one-shot, explicit push marker permits P0 live acceptance on a
      # reviewed merge without permanently uploading 5 MiB+ on every push.
      TELEDRIVE_E2E_MULTIPART: ${{ ((github.event_name == 'workflow_dispatch' && inputs.run_multipart) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[p0-live-multipart]'))) && '1' || '0' }}
      TELEDRIVE_E2E_SOAK: ${{ ((github.event_name == 'workflow_dispatch' && inputs.run_soak) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[p1-live-soak]'))) && '1' || '0' }}
    steps:
      # The channel ID must come from an Actions SECRET, never a repository
      # variable: vars can be printed unredacted in a step's initial env dump.
      # Install masks before checkout, dependency installation, or pytest.
      - name: Mask dedicated Telegram test target
        shell: bash
        run: |
          if [[ -z "$TELEDRIVE_E2E_BOT_CHAT_ID" ]]; then
            echo "::error::Configure TELEDRIVE_E2E_BOT_CHAT_ID as a repository Actions secret."
            exit 1
          fi
          echo "::add-mask::$TELEDRIVE_E2E_BOT_CHAT_ID"
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Check Bot E2E configuration
        shell: bash
        id: configured
        run: |
          if [[ -z "$TELEDRIVE_E2E_BOT_TOKEN" || -z "$TELEDRIVE_E2E_BOT_CHAT_ID" ]]; then
            echo "::error::Bot E2E not configured; add TELEDRIVE_E2E_BOT_TOKEN and TELEDRIVE_E2E_BOT_CHAT_ID repository secrets."
            exit 1
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Python
        if: steps.configured.outputs.enabled == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install storage dependencies
        if: steps.configured.outputs.enabled == 'true'
        run: |
          python -m pip install -e .
          python -m pip install pytest
      - name: Real bot upload retrieval checksum range and cleanup
        if: steps.configured.outputs.enabled == 'true'
        run: python -m pytest -q tests/test_telegram_bot_e2e.py
