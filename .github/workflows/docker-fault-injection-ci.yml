name: TeleDrive Docker Fault Injection CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: teledrive-docker-fault-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  disposable-docker-fault-injection:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Verify Docker Compose
        run: |
          docker version
          docker compose version
      - name: Install two clean TeleDrive apps and inject recoverable faults
        env:
          TELEDRIVE_FAULT_REPORT_DIR: ${{ runner.temp }}/docker-fault-evidence
        run: bash scripts/run_docker_fault_injection.sh
      - name: Publish sanitized acceptance report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: docker-fault-injection-report
          path: ${{ runner.temp }}/docker-fault-evidence/*.json
          if-no-files-found: warn
          retention-days: 14
