name: Security CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/docker-webui-multiaccount
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-web.txt
          python -m pip install pytest httpx bandit pip-audit
      - name: Compile
        run: python -m compileall -q teledrive web app tests
      - name: Packaged CLI import and entrypoint
        run: |
          python -m teledrive.uploader --help
          python -m pip install --no-deps -e .
          python -c "import teledrive.db, teledrive.uploader; print('package-import-ok')"

      - name: Unit tests
        run: python -m pytest -q tests/test_security.py tests/test_desktop_support.py tests/test_openapi.py tests/test_storage_engine.py tests/test_storage_recovery.py tests/test_bot_storage.py tests/test_telegram_target_resolution.py tests/test_ci_workflows.py tests/test_storage_catalog.py tests/test_api_keys.py tests/test_rest_api.py tests/test_rest_transfer.py tests/test_s3_sigv4_defense.py
      - name: Dependency consistency
        run: python -m pip check
      - name: Bandit
        run: bandit -q -r teledrive web -ll
      - name: Dependency audit
        run: pip-audit -r requirements-web.txt
      - name: Docker Compose config
        env:
          TELEDRIVE_WEB_PASSWORD: ci-only-not-a-real-secret
        run: |
          docker compose config --quiet
          docker compose --profile s3 config --quiet

      - name: Docker build
        run: docker build --pull -t teledrive-security-ci .

      - name: Web UI container smoke test
        shell: bash
        run: |
          set -euo pipefail
          cid="$(docker run -d --rm             -e TELEDRIVE_WEB_USER=ci             -e TELEDRIVE_WEB_PASSWORD=ci-only-not-a-real-secret             -p 127.0.0.1:18080:8080             teledrive-security-ci)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error               -u ci:ci-only-not-a-real-secret               http://127.0.0.1:18080/api/dashboard >/tmp/dashboard.json; then
              break
            fi
            sleep 1
          done
          test -s /tmp/dashboard.json
          python - <<'PY'
          import json
          data = json.load(open("/tmp/dashboard.json", encoding="utf-8"))
          assert "queue" in data
          assert "accounts" in data
          assert "database_url" in data
          PY
          curl --fail --silent --show-error \
            -u ci:ci-only-not-a-real-secret \
            http://127.0.0.1:18080/openapi.json >/tmp/openapi.json
          python - <<'PY'
          import json
          schema = json.load(open("/tmp/openapi.json", encoding="utf-8"))
          assert "/api/auth" in schema["paths"]
          assert "/api/process/start" in schema["paths"]
          PY
          if curl --fail --silent http://127.0.0.1:18080/openapi.json >/dev/null; then
            echo "Unauthenticated OpenAPI schema access unexpectedly succeeded" >&2
            exit 1
          fi
          if curl --fail --silent http://127.0.0.1:18080/api/config >/dev/null; then
            echo "Unauthenticated API access unexpectedly succeeded" >&2
            exit 1
          fi
      - name: S3 gateway Docker container smoke
        shell: bash
        run: |
          set -euo pipefail
          cid="$(docker run -d --rm \
            -p 127.0.0.1:19000:9000 \
            teledrive-security-ci \
            uvicorn web.s3:app --host 0.0.0.0 --port 9000 --workers 1)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          ready=0
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:19000/__health > /tmp/s3-health.json; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          python - <<'PY'
          import json
          with open("/tmp/s3-health.json", encoding="utf-8") as f:
              assert json.load(f) == {"ok": True}
          PY

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: teledrive-security-ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
