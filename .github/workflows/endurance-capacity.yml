name: 06 · Endurance | Isolated Capacity Soak

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Isolated endurance duration (minimum 60 minutes)"
        required: true
        default: "60"
        type: string

permissions:
  contents: read

jobs:
  isolated-endurance:
    name: 60m+ SQL / object-engine endurance
    runs-on: ubuntu-latest
    timeout-minutes: 125
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install application
        run: |
          python -m pip install -e .
          python -m pip check
      - name: Verify one-hour minimum and run isolated capacity test
        env:
          REQUEST_MINUTES: ${{ inputs.duration_minutes }}
        run: |
          set -euo pipefail
          if ! [[ "$REQUEST_MINUTES" =~ ^[0-9]{1,3}$ ]]; then exit 2; fi
          if (( 10#$REQUEST_MINUTES < 60 || 10#$REQUEST_MINUTES > 110 )); then exit 2; fi
          python scripts/ops/capacity_probe.py \
            --duration-seconds "$((10#$REQUEST_MINUTES * 60))" \
            --object-bytes 65536 \
            --output "$RUNNER_TEMP/capacity-evidence.json"
      - name: Preserve isolated, non-production evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: capacity-evidence
          path: ${{ runner.temp }}/capacity-evidence.json
          if-no-files-found: warn
          retention-days: 14
      - name: Publish CI run summary
        if: always()
        shell: bash
        run: |
          echo '### 06 · Endurance | Isolated Capacity Soak' >> "$GITHUB_STEP_SUMMARY"
          echo '| Field | Value |' >> "$GITHUB_STEP_SUMMARY"
          echo '| --- | --- |' >> "$GITHUB_STEP_SUMMARY"
          echo '| Type | Synthetic Telegram, real SQLite; NOT live production |' >> "$GITHUB_STEP_SUMMARY"
          echo '| Result | ${{ job.status }} |' >> "$GITHUB_STEP_SUMMARY"
