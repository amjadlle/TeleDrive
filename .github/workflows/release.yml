name: Build and publish release

on:
  push:
    tags:
      - "v*.*.*"
    # On these branch updates validate the release gate without publishing.
    branches:
      - main
      - feature/docker-webui-multiaccount
    paths:
      - ".github/workflows/release.yml"
      - "tests/test_ci_workflows.py"

permissions:
  contents: read

jobs:
  verify:
    name: Verify tag source and regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source and history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require release tags to point into main
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          git show-ref --verify --quiet refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::Release tag does not point to a commit reachable from main"
            exit 1
          fi
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
          cache: pip
      - name: Install test runtime
        run: |
          python -m pip install -r requirements-web.txt
          python -m pip install pytest httpx bandit pip-audit boto3
          python -m pip check
      - name: Compile application
        run: python -m compileall -q teledrive web app tests
      - name: Offline storage, API, recovery, bot and security regression tests
        run: |
          python -m pytest -q \
            tests/test_security.py tests/test_openapi.py \
            tests/test_desktop_support.py tests/test_storage_engine.py \
            tests/test_storage_recovery.py tests/test_storage_catalog.py \
            tests/test_bot_storage.py tests/test_telegram_target_resolution.py tests/test_ci_workflows.py \
            tests/test_api_keys.py tests/test_rest_api.py tests/test_rest_transfer.py \
            tests/test_s3_p0_acceptance.py
      - name: Security checks
        run: |
          bandit -q -r teledrive web -ll
          pip-audit -r requirements-web.txt

  build:
    needs: verify
    if: github.ref_type == 'tag'
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: TeleDrive-linux-x86_64
            asset_path: dist-installer/TeleDrive-linux-x86_64.tar.gz
          - os: windows-latest
            artifact_name: TeleDrive-windows
            asset_path: dist-installer/*.exe

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"

      - name: Build Linux package
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/build-linux.sh

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $iss = Get-Content installer\TelegramAutoUpload.iss -Raw
          $iss = [regex]::Replace($iss, '#define MyAppVersion ".*?"', ('#define MyAppVersion "' + $version + '"'))
          Set-Content installer\TelegramAutoUpload.iss $iss -NoNewline
          .\scripts\build.ps1
          .\scripts\build-installer.ps1

      - name: Upload package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_path }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    if: github.ref_type == 'tag' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release and attach packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --generate-notes \
              --title "TeleDrive $GITHUB_REF_NAME"
          fi
