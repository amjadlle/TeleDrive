name: 02 · Integration | REST & S3

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: storage-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  storage-api:
    name: Storage · REST / S3 / AWS CLI / rclone
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/server.txt
      - name: Install API and test runtime
        run: |
          python -m pip install -r requirements/server.txt
          python -m pip install pytest httpx boto3
          python -m pip check
      - name: Install actual AWS CLI and rclone clients
        run: |
          python -m pip install awscli
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rclone
          aws --version
          rclone version
      - name: Compile API and storage
        run: python -m compileall -q teledrive web tests
      - name: Check browser API management scripts
        run: node --check web/static/app.js
      - name: Actual AWS CLI and rclone process integration
        env:
          TELEDRIVE_REQUIRE_CLI_CLIENTS: "1"
        run: python -m pytest -vv tests/test_s3_cli_compat.py
      - name: Real SQL and HTTP contract tests with fake Telegram I/O
        run: |
          python -m pytest -q \
            tests/test_api_keys.py \
            tests/test_rest_api.py \
            tests/test_rest_transfer.py tests/test_unified_service.py \
            tests/test_storage_engine.py \
            tests/test_storage_user_mode.py \
            tests/test_storage_recovery.py tests/test_storage_rebuild.py tests/test_telegram_inventory_reconcile.py \
            tests/test_storage_pending_admin.py \
            tests/test_storage_jobs.py \
            tests/test_legacy_bridge.py \
            tests/test_legacy_import_admin.py \
            tests/test_metadata_backup.py \
            tests/test_storage_sigkill.py \
            tests/test_storage_multiworker.py \
            tests/test_metadata_snapshot_rehearsal.py \
            tests/test_storage_versions.py \
            tests/test_storage_ops_health.py tests/test_host_soak.py tests/test_acceptance_cli.py \
            tests/test_storage_gc_retention.py tests/test_gc_reference_planner.py \
            tests/test_s3_version_reads.py tests/test_s3_bucket_versioning.py tests/test_s3_public_access_block.py tests/test_s3_lifecycle.py \
            tests/test_s3_delete_markers.py \
            tests/test_s3_version_listing.py \
            tests/test_s3_version_tagging.py \
            tests/test_s3_version_copy.py \
            tests/test_s3_vhost.py \
            tests/test_s3_additional_checksums.py \
            tests/test_s3_presigned_complete.py \
            tests/test_s3_post_policy.py \
            tests/test_storage_catalog.py \
            tests/test_bot_storage.py \
            tests/test_bot_receipt_reconcile.py \
            tests/test_telegram_dr_rehearsal.py \
            tests/test_legacy_cutover_acceptance.py \
            tests/test_bot_rate_slots.py \
            tests/test_s3_gateway.py tests/test_s3_bucket_listing.py \
            tests/test_s3_credentials.py \
            tests/test_s3_admin.py \
            tests/test_s3_multipart.py \
            tests/test_s3_multipart_preconditions.py \
            tests/test_s3_recovery.py \
            tests/test_s3_presigned.py \
            tests/test_s3_copy.py \
            tests/test_s3_tagging.py \
            tests/test_s3_batch_delete.py \
            tests/test_s3_metadata.py \
            tests/test_s3_bucket_location.py \
            tests/test_s3_listing_v1.py \
            tests/test_s3_conditions.py \
            tests/test_s3_conditional_writes.py \
            tests/test_s3_cors.py \
            tests/test_s3_object_attributes.py \
            tests/test_s3_sigv4_defense.py \
            tests/test_s3_fail_closed.py tests/test_s3_route_guard.py tests/test_s3_policy_status.py \
            tests/test_s3_contract.py \
            tests/test_s3_permissions.py \
            tests/test_storage_gc_audit.py \
            tests/test_storage_gc_admin.py
      - name: Publish CI run summary
        if: always()
        shell: bash
        run: |
          echo '### 02 · Integration | REST & S3' >> "$GITHUB_STEP_SUMMARY"
          echo '| Detail | Value |' >> "$GITHUB_STEP_SUMMARY"
          echo '| --- | --- |' >> "$GITHUB_STEP_SUMMARY"
          echo '| Scope | REST and S3 protocol; real AWS CLI and rclone processes |' >> "$GITHUB_STEP_SUMMARY"
          echo '| Result | ${{ job.status }} |' >> "$GITHUB_STEP_SUMMARY"
          printf '| Ref | %s |\n' "$GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
          printf '| Commit | %s |\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
