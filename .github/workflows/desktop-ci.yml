name: 02 · Integration | Desktop

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0

      - name: Install desktop and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[desktop]" pytest
          python -m pip check
      - name: Compile all Python modules
        run: python -m compileall -q app teledrive tests
      - name: Desktop and account integration tests
        run: python -m pytest -vv -s tests/test_desktop_support.py tests/test_desktop_ui.py
      - name: Test desktop module/CLI entrypoint
        run: |
          python -m teledrive.uploader --help
          python -c "from teledrive.desktop import main; from app.main import main as desktop_main; print('desktop entrypoints import OK')"
      - name: Build Linux portable application
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash scripts/build-linux.sh
          test -x dist/TeleDrive/TeleDrive
          QT_QPA_PLATFORM=offscreen dist/TeleDrive/TeleDrive --cli --help
          tar -tzf dist-installer/TeleDrive-linux-x86_64.tar.gz | grep 'TeleDrive/TeleDrive'
      - name: Build Windows portable application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/build.ps1
          if (-not (Test-Path dist/TeleDrive.exe)) { throw 'PyInstaller EXE missing' }
          & ./dist/TeleDrive.exe --cli --help
          if ($LASTEXITCODE -ne 0) { throw "Frozen CLI exit code $LASTEXITCODE" }
      - name: Verify Windows installer script
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path scripts/build-installer.ps1)) { throw 'Installer script missing' }
          if (-not (Test-Path installer/TelegramAutoUpload.iss)) { throw 'Inno Setup recipe missing' }
          $iscc = Get-Command ISCC -ErrorAction SilentlyContinue
          if ($iscc) {
            ./scripts/build-installer.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          } else {
            Write-Host 'Inno Setup is not installed on this runner; installer packaging requires release job.'
          }
      - name: Publish CI run summary
        if: always()
        shell: bash
        run: |
          echo '### 02 · Integration | Desktop' >> "$GITHUB_STEP_SUMMARY"
          echo '| Detail | Value |' >> "$GITHUB_STEP_SUMMARY"
          echo '| --- | --- |' >> "$GITHUB_STEP_SUMMARY"
          echo '| Scope | Windows and Linux UI, CLI and portable packaging |' >> "$GITHUB_STEP_SUMMARY"
          echo '| Result | ${{ job.status }} |' >> "$GITHUB_STEP_SUMMARY"
          printf '| Ref | %s |\n' "$GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
          printf '| Commit | %s |\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
