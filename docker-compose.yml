services:
  teledrive:
    build:
      context: .
      args:
        TELEDRIVE_DB_EXTRA_PACKAGES: ${TELEDRIVE_DB_EXTRA_PACKAGES:-}
    container_name: teledrive
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${TELEDRIVE_BIND_ADDRESS:-127.0.0.1}:${TELEDRIVE_WEB_PORT:-8080}:8080"
    environment:
      TELEDRIVE_CONFIG: /config/config.yaml
      TELEDRIVE_AUTH_DIR: /data/auth
      TELEDRIVE_STORAGE_BOT_TOKEN: ${TELEDRIVE_STORAGE_BOT_TOKEN:-}
      TELEDRIVE_STORAGE_BOT_CHAT_ID: ${TELEDRIVE_STORAGE_BOT_CHAT_ID:-}
      TELEDRIVE_STORAGE_SCRATCH_DIR: /data/tmp
      TELEDRIVE_REST_MAX_UPLOAD_BYTES: ${TELEDRIVE_REST_MAX_UPLOAD_BYTES:-2147483648}
      TELEDRIVE_WEB_USER: ${TELEDRIVE_WEB_USER:-admin}
      TELEDRIVE_WEB_PASSWORD: ${TELEDRIVE_WEB_PASSWORD:-}
      TELEDRIVE_ALLOW_INSECURE: ${TELEDRIVE_ALLOW_INSECURE:-0}
      TELEDRIVE_ALLOWED_HOSTS: ${TELEDRIVE_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}
      TELEDRIVE_ALLOWED_SOURCE_ROOTS: /uploads
      TELEDRIVE_ALLOWED_SESSION_ROOTS: /data/sessions
      TELEDRIVE_ALLOWED_LOG_ROOTS: /data
      TELEDRIVE_ALLOWED_SQLITE_ROOTS: /data
      TELEDRIVE_SPLIT_DIR: /data/tmp
      TELEDRIVE_SPLIT_MIN_FREE_BYTES: ${TELEDRIVE_SPLIT_MIN_FREE_BYTES:-536870912}
      TELEDRIVE_LOCK_DIR: /data/tmp
      TZ: ${TZ:-Europe/Istanbul}
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    volumes:
      - ./config:/config
      - ./data:/data
      - ./uploads:/uploads:ro
