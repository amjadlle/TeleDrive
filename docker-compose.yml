# One process/container serves WebUI 8080 and S3 9000; same SQL/Telegram metadata.
# All service settings come from config/config.yaml (see config.example.yaml).
# The only environment variables are TZ, PUID/PGID and TELEDRIVE_CONFIG.
services:
  teledrive:
    build:
      context: .
      args:
        TELEDRIVE_DB_EXTRA_PACKAGES: ${TELEDRIVE_DB_EXTRA_PACKAGES:-}
    container_name: teledrive
    image: teledrive:local
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      # The service binds 0.0.0.0 inside the container; keep the host side
      # loopback unless a reverse proxy/VPN explicitly publishes it.
      - "127.0.0.1:${TELEDRIVE_WEB_PORT:-8080}:8080"
      - "127.0.0.1:${TELEDRIVE_S3_PORT:-9000}:9000"
    environment:
      TELEDRIVE_CONFIG: /config/config.yaml
      TZ: ${TZ:-Europe/Istanbul}
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    volumes:
      - ./config:/config
      - ./data:/data
      - ./uploads:/uploads:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=5); urllib.request.urlopen('http://127.0.0.1:9000/__health', timeout=5)"]
      interval: 30s
      timeout: 8s
      start_period: 20s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
