[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-auto-upload"
version = "1.0.7"
description = "Safe, resumable Telegram file uploader for Windows and Linux"
requires-python = ">=3.11"
dependencies = [
  "Telethon>=1.36,<2",
  "PyYAML>=6.0,<7",
  "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
desktop = ["PySide6>=6.7,<7", "cryptography>=50.0.2,<51"]

[project.scripts]
telegram-auto-upload = "app.main:main"
telegram-auto-upload-cli = "teledrive.uploader:main"

[tool.setuptools.packages.find]
include = ["app*", "teledrive*"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
